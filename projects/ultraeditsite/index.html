<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav_ult</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo">
                <img src="UE_Site-Logo-webp.webp" title="logo">
            </div>

                <ol>
                    <li>Products</li>

                    <li>Renew</li>

                    <li>Learn</li>
                    <li>Company</li>

                <button class="download">Download</button>
                <button class="language">English</button>
                <img class="search" src="searchicon.png" title="search">
            </div>
        </nav>

        <div class="grid">
            <div class="item">
                <div class="item_content">
